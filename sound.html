<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音のデジタル化体験</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f4f6f8;
            color: #2c3e50;
            font-size: 13px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 18px;
            margin: 4px 0 16px;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* セクションボックス（余白をしっかり確保） */
        .section-box {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #34495e;
            font-size: 12px;
        }
        input[type="file"], button {
            width: 100%;
            padding: 8px 6px;
            font-size: 12px;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        /* ①音源選択ボタン（統一感のあるシックなデザイン） */
        .source-btn {
            background-color: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .source-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
            border-color: #94a3b8;
        }

        /* パラメータ左右レイアウト */
        .param-container {
            display: flex;
            gap: 16px;
        }
        .param-block {
            flex: 1;
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .param-btn {
            background-color: #f8fafc;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 8px 4px;
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            font-weight: normal;
            transition: all 0.2s ease;
        }
        .param-btn small {
            display: block;
            font-size: 9px;
            color: #64748b;
            margin-top: 3px;
        }
        .param-btn:hover {
            background-color: #f1f5f9;
        }
        .param-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            font-weight: bold;
        }
        .param-btn.active small {
            color: #dbeafe;
        }

        .recording { 
            animation: pulse 1s infinite; 
            background-color: #ef4444 !important; 
            color: white !important;
            border-color: #dc2626 !important;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        canvas {
            width: 100%;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            border-radius: 4px;
            display: block;
        }
        #canvasMacro { height: 110px; }
        #canvasMicro { height: 170px; }

        .canvas-title {
            font-size: 12px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* 最下部（データサイズ ＆ 再生コントロール） */
        .bottom-container {
            display: flex;
            gap: 12px;
            align-items: stretch;
            margin-top: 4px;
        }
        .info-box {
            flex: 1;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 11px;
            color: #0369a1;
            text-align: left;
            line-height: 1.5;
        }
        .info-title {
            font-weight: bold;
            color: #0284c7;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .controls-box {
            flex: 1;
            display: flex;
            gap: 10px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            align-items: center;
        }
        .controls-box button {
            flex: 1;
            height: 100%;
            min-height: 52px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #playBtn { background-color: #16a34a; }
        #playBtn:hover { background-color: #15803d; }
        #stopBtn { background-color: #475569; }
        #stopBtn:hover { background-color: #334155; }
        button:disabled { background-color: #cbd5e1 !important; cursor: not-allowed; opacity: 0.7; }

        #errorMsg { 
            display: none; 
            color: #991b1b; 
            background: #fee2e2; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>音のデジタル化体験</h1>
    
    <div class="container">
        
        <div id="errorMsg"></div>

        <!-- 1段目：音源選択 -->
        <div class="section-box">
            <div class="flex-row">
                <button id="micBtn" class="source-btn" style="flex:1;">マイク録音</button>
                <button id="sampleBtn" class="source-btn" style="flex:1;">サンプル音源</button>
                <button id="sineBtn" class="source-btn" style="flex:1;">440Hz</button>
                <button id="fileBtn" class="source-btn" style="flex:1;">ファイル読み込み</button>
            </div>
            <input type="file" id="audioFile" accept="audio/*" style="display: none;">
        </div>

        <!-- 2段目：パラメータ選択（Z型・高い順配置） -->
        <div class="section-box">
            <div class="param-container">
                <!-- 左：サンプリング周波数 (Z型: 44100 -> 22050 -> 8000 -> 4000) -->
                <div class="param-block">
                    <label>サンプリング周波数</label>
                    <div class="grid-2x2" id="sampleRateGroup">
                        <button class="param-btn active" data-value="44100">44100Hz<br><small>CD音質</small></button>
                        <button class="param-btn" data-value="22050">22050Hz<br><small>FMラジオ</small></button>
                        <button class="param-btn" data-value="8000">8000Hz<br><small>電話</small></button>
                        <button class="param-btn" data-value="4000">4000Hz<br><small>トランシーバー</small></button>
                    </div>
                </div>

                <!-- 右：量子化ビット数 (Z型: 16 -> 8 -> 4 -> 2) -->
                <div class="param-block">
                    <label>量子化ビット数</label>
                    <div class="grid-2x2" id="bitDepthGroup">
                        <button class="param-btn active" data-value="16">16bit<br><small>CD音質</small></button>
                        <button class="param-btn" data-value="8">8bit<br><small>レトロゲーム</small></button>
                        <button class="param-btn" data-value="4">4bit<br><small>昔のPC</small></button>
                        <button class="param-btn" data-value="2">2bit<br><small>激しいノイズ</small></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3段目：全体波形 -->
        <div class="section-box">
            <div class="canvas-title">波形 (全体像)</div>
            <canvas id="canvasMacro"></canvas>
        </div>

        <!-- 4段目：拡大波形 -->
        <div class="section-box">
            <div class="canvas-title">拡大波形 (ステップ描画)</div>
            <canvas id="canvasMicro"></canvas>
        </div>

        <!-- 5段目：データサイズ表示 (左) ＆ 再生・停止 (右) -->
        <div class="bottom-container">
            <div class="info-box">
                <div class="info-title">📊 データサイズ表示 (無圧縮・モノラル)</div>
                設定: <strong id="infoSetting">44100 Hz / 16 bit</strong><br>
                1秒あたり: <strong id="infoRate">88,200 Byte/秒 (約 88.2 KB/秒)</strong><br>
                <span id="infoTotal">全体サイズ: 音声をセットすると計算されます</span>
            </div>
            
            <div class="controls-box">
                <button id="playBtn" disabled>▶ 再生</button>
                <button id="stopBtn" disabled>■ 停止</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 【重要】ここにBase64に変換した長い文字列を貼り付けます
        // ==========================================
        const audioDataUrl = "data:audio/mp3;base64,＜ここにデータ＞";
        
        let audioCtx;
        let originalBuffer = null;
        let processedBuffer = null;
        let currentSource = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        let currentSampleRate = 44100;
        let currentBitDepth = 16;

        const sampleBtn = document.getElementById('sampleBtn');
        const sineBtn = document.getElementById('sineBtn');
        const fileBtn = document.getElementById('fileBtn');
        const micBtn = document.getElementById('micBtn');
        const fileInput = document.getElementById('audioFile');
        const errorMsg = document.getElementById('errorMsg');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
            setTimeout(() => { errorMsg.style.display = 'none'; }, 6000);
        }

        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function resetButtonStates() {
            sampleBtn.disabled = false;
            sampleBtn.textContent = "サンプル音源";
            sineBtn.disabled = false;
            sineBtn.textContent = "440Hz";
            fileBtn.disabled = false;
            fileBtn.textContent = "ファイル読み込み";
            micBtn.disabled = false;
            micBtn.textContent = "マイク録音";
            micBtn.classList.remove('recording');
        }

        // パラメータボタンのイベント設定
        document.querySelectorAll('#sampleRateGroup .param-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#sampleRateGroup .param-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSampleRate = parseInt(btn.getAttribute('data-value'));
                processAndDraw();
            });
        });

        document.querySelectorAll('#bitDepthGroup .param-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#bitDepthGroup .param-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBitDepth = parseInt(btn.getAttribute('data-value'));
                processAndDraw();
            });
        });

        // 概算データサイズの計算と更新
        function updateInfo() {
            const bytesPerSec = currentSampleRate * (currentBitDepth / 8);
            const kbPerSec = (bytesPerSec / 1000).toFixed(1);

            document.getElementById('infoSetting').textContent = `${currentSampleRate} Hz / ${currentBitDepth} bit`;
            document.getElementById('infoRate').textContent = `${bytesPerSec.toLocaleString()} Byte/秒 (約 ${kbPerSec} KB/秒)`;

            const infoTotal = document.getElementById('infoTotal');
            if (originalBuffer) {
                const duration = originalBuffer.duration;
                const totalBytes = Math.round(bytesPerSec * duration);
                const totalKb = (totalBytes / 1000).toFixed(1);
                infoTotal.innerHTML = `全体サイズ (約${duration.toFixed(1)}秒): <strong>${totalBytes.toLocaleString()} Byte (約 ${totalKb} KB)</strong>`;
            } else {
                infoTotal.textContent = `全体サイズ: 音声をセットすると計算されます`;
            }
        }

        function normalizeAudioBuffer(buffer) {
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                const data = buffer.getChannelData(c);
                
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                }
                const dcOffset = sum / data.length;

                let maxAmp = 0.0001;
                for (let i = 0; i < data.length; i++) {
                    data[i] -= dcOffset;
                    const absVal = Math.abs(data[i]);
                    if (absVal > maxAmp) {
                        maxAmp = absVal;
                    }
                }

                const factor = 0.95 / maxAmp;
                for (let i = 0; i < data.length; i++) {
                    data[i] *= factor;
                }
            }
        }

        micBtn.addEventListener('click', async () => {
            initAudioCtx();
            errorMsg.style.display = 'none';

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        } 
                    });
                    
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks);
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        
                        try {
                            const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
                            normalizeAudioBuffer(decodedData);
                            originalBuffer = decodedData;
                            processAndDraw();
                            playBtn.disabled = false;
                            
                            resetButtonStates();
                            micBtn.textContent = "🎤 再録音する";
                        } catch (err) {
                            showError("録音データの解析に失敗しました。");
                            resetButtonStates();
                        }
                        
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.textContent = "⏹️ 録音停止";
                    micBtn.classList.add('recording');
                    
                    sampleBtn.disabled = true;
                    sineBtn.disabled = true;
                    fileBtn.disabled = true;
                    playBtn.disabled = true;

                } catch (err) {
                    console.error(err);
                    showError("マイクへのアクセスが拒否されたか、マイクが見つかりません。ブラウザの権限設定を確認してください。");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.textContent = "処理中...";
                micBtn.classList.remove('recording');
            }
        });

        sampleBtn.addEventListener('click', async () => {
            initAudioCtx();
            errorMsg.style.display = 'none';
            resetButtonStates();
            sampleBtn.disabled = true;
            sampleBtn.textContent = "読込中...";

            try {
                const response = await fetch(audioDataUrl);
                const arrayBuffer = await response.arrayBuffer();

                audioCtx.decodeAudioData(arrayBuffer, function(decodedData) {
                    normalizeAudioBuffer(decodedData);
                    originalBuffer = decodedData;
                    processAndDraw();
                    playBtn.disabled = false;
                    resetButtonStates();
                }, function(err) {
                    showError('音声の解析に失敗しました。Base64の文字列が正しいか確認してください。');
                    resetButtonStates();
                });
            } catch (err) {
                console.error(err);
                showError('読み込み処理でエラーが発生しました。');
                resetButtonStates();
            }
        });

        sineBtn.addEventListener('click', () => {
            generateSineWave();
        });

        function generateSineWave() {
            initAudioCtx();
            errorMsg.style.display = 'none';
            resetButtonStates();
            
            const duration = 2.0; 
            const frequency = 440.0; 
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                
                let env = 1.0;
                const attackSamples = sampleRate * 0.02; 
                const releaseSamples = sampleRate * 0.05; 
                if (i < attackSamples) {
                    env = i / attackSamples;
                } else if (i > length - releaseSamples) {
                    env = (length - i) / releaseSamples;
                }

                data[i] = 0.95 * env * Math.sin(2 * Math.PI * frequency * t);
            }

            originalBuffer = buffer;
            processAndDraw();
            playBtn.disabled = false;
            resetButtonStates();
        }

        fileBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            initAudioCtx();
            errorMsg.style.display = 'none';
            playBtn.disabled = true;
            stopBtn.disabled = true;
            fileBtn.textContent = "読込中...";

            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                audioCtx.decodeAudioData(arrayBuffer, function(decodedData) {
                    normalizeAudioBuffer(decodedData);
                    originalBuffer = decodedData;
                    processAndDraw();
                    playBtn.disabled = false;
                    resetButtonStates();
                }, function(err) {
                    showError('このファイルはブラウザで処理できませんでした。');
                    resetButtonStates();
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function processAndDraw() {
            updateInfo();

            if (!originalBuffer) return;

            const targetSampleRate = currentSampleRate;
            const bitDepth = currentBitDepth;
            const ctxSampleRate = originalBuffer.sampleRate;
            const stepRatio = ctxSampleRate / targetSampleRate;
            const steps = Math.pow(2, bitDepth);

            processedBuffer = audioCtx.createBuffer(
                originalBuffer.numberOfChannels, 
                originalBuffer.length, 
                ctxSampleRate
            );

            for (let c = 0; c < originalBuffer.numberOfChannels; c++) {
                const inData = originalBuffer.getChannelData(c);
                const outData = processedBuffer.getChannelData(c);
                let currentVal = 0;

                for (let i = 0; i < originalBuffer.length; i++) {
                    let downsampledIdx = Math.floor(i / stepRatio);
                    if (i === 0 || downsampledIdx > Math.floor((i - 1) / stepRatio)) {
                        let val = inData[i];
                        let normalized = (val + 1) / 2;
                        let quantized = Math.round(normalized * (steps - 1)) / (steps - 1);
                        currentVal = (quantized * 2) - 1;
                    }
                    outData[i] = currentVal;
                }
            }
            drawWaveforms(processedBuffer);
        }

        function drawWaveforms(buffer) {
            const canvasMacro = document.getElementById('canvasMacro');
            const canvasMicro = document.getElementById('canvasMicro');
            const ctxMacro = canvasMacro.getContext('2d');
            const ctxMicro = canvasMicro.getContext('2d');
            
            canvasMacro.width = canvasMacro.clientWidth;
            canvasMacro.height = canvasMacro.clientHeight;
            canvasMicro.width = canvasMicro.clientWidth;
            canvasMicro.height = canvasMicro.clientHeight;

            const data = buffer.getChannelData(0);

            // 全体波形の描画
            ctxMacro.clearRect(0, 0, canvasMacro.width, canvasMacro.height);

            ctxMacro.strokeStyle = '#cbd5e1';
            ctxMacro.lineWidth = 1;
            ctxMacro.beginPath();
            ctxMacro.moveTo(0, canvasMacro.height / 2);
            ctxMacro.lineTo(canvasMacro.width, canvasMacro.height / 2);
            ctxMacro.stroke();

            ctxMacro.strokeStyle = '#2563eb';
            ctxMacro.lineWidth = 1.5;
            ctxMacro.beginPath();

            const numPixels = canvasMacro.width;
            const step = data.length / numPixels;

            for (let i = 0; i < numPixels; i++) {
                const idx = Math.floor(i * step);
                const val = data[idx];
                const x = i;
                const y = (1 - val * 0.9) / 2 * canvasMacro.height;

                if (i === 0) {
                    ctxMacro.moveTo(x, y);
                } else {
                    ctxMacro.lineTo(x, y);
                }
            }
            ctxMacro.stroke();

            // 拡大波形の描画
            ctxMicro.clearRect(0, 0, canvasMicro.width, canvasMicro.height);
            ctxMicro.lineWidth = 2;
            ctxMicro.strokeStyle = '#dc2626';
            
            let maxIdx = 0;
            let maxVal = 0;
            for (let i = 0; i < data.length; i++) {
                if (Math.abs(data[i]) > maxVal) {
                    maxVal = Math.abs(data[i]);
                    maxIdx = i;
                }
            }

            const microSamples = Math.floor(buffer.sampleRate * 0.012); 
            let startIdx = Math.max(0, maxIdx - Math.floor(microSamples / 2));
            if (startIdx + microSamples > data.length) {
                startIdx = Math.max(0, data.length - microSamples);
            }
            const drawLen = Math.min(microSamples, data.length - startIdx);
            
            ctxMicro.beginPath();
            let prevY = 0;
            for (let i = 0; i < drawLen; i++) {
                const x = (i / drawLen) * canvasMicro.width;
                const val = data[startIdx + i];
                const y = (1 - val * 0.9) / 2 * canvasMicro.height;

                if (i === 0) {
                    ctxMicro.moveTo(x, y);
                } else {
                    ctxMicro.lineTo(x, prevY);
                    ctxMicro.lineTo(x, y);
                }
                prevY = y;
            }
            ctxMicro.stroke();
        }

        playBtn.addEventListener('click', () => {
            if (!processedBuffer) return;
            initAudioCtx(); 
            
            if (currentSource) currentSource.stop();
            currentSource = audioCtx.createBufferSource();
            currentSource.buffer = processedBuffer;
            currentSource.connect(audioCtx.destination);
            currentSource.start();
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            if (currentSource) {
                currentSource.stop();
                currentSource = null;
            }
            stopBtn.disabled = true;
        });

        updateInfo();
    </script>
</body>
</html>
